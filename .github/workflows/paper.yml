name: Бумажная торговля

# Запуск каждые 4 часа — по закрытию бара на выбранном таймфрейме.
# Расписание в GitHub неточное: задержка 5-30 минут обычна. Для 4-часовых
# свечей это несущественно, для минутных было бы неприемлемо.
on:
  schedule:
    - cron: "17 */4 * * *"     # короткие сделки: каждые 4 часа
    - cron: "17 8 * * *"       # долгосрочный обзор: раз в сутки
  workflow_dispatch:            # кнопка ручного запуска на вкладке Actions

# Нужно право записи: журнал сделок коммитится обратно в репозиторий,
# иначе следующий запуск не увидит открытые позиции.
permissions:
  contents: write

concurrency:
  group: paper-trading
  cancel-in-progress: false     # не обрывать проход на середине

jobs:
  # Идентификатор задания обязан быть латиницей: GitHub разбирает его
  # как имя переменной, и кириллица ломает файл целиком — запуск создаётся,
  # но не выполняет ни одного шага.
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Забрать код и журнал
        uses: actions/checkout@v4

      - name: Поставить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
        # Зависимостей нет намеренно — весь движок на стандартной библиотеке,
        # поэтому шага установки пакетов здесь нет.

      - name: Проверить правила риск-менеджмента
        # Если правила сломаны, торговать нельзя даже на бумаге.
        run: |
          python tests/test_rules.py
          python tests/test_signals.py
          python tests/test_stop_after_entry.py
          python tests/test_journals_walk.py

      - name: Провести сделки и найти новые сигналы
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # Флаг --жив включается по воскресеньям: раз в неделю бот
        # подтверждает, что работает, даже если сигналов не было.
        run: |
          if [ "$(date -u +%u)" = "7" ] && [ "$(date -u +%H)" = "08" ]; then
            python paper.py --жив
          else
            python paper.py
          fi

      - name: Долгосрочный обзор
        # Раз в сутки, в утренний запуск. Дневная свеча меняется раз в день,
        # чаще смотреть нечего. Это отдельная система от короткой торговли.
        if: ${{ github.event.schedule == '17 8 * * *' || github.event_name == 'workflow_dispatch' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python long.py --tg

      - name: Система прорывов
        # Раз в сутки после закрытия дневной свечи. Отдельная система:
        # ловит движения, которые обе прежние пропускают по своим причинам.
        if: ${{ github.event.schedule == '17 8 * * *' || github.event_name == 'workflow_dispatch' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python breakouts.py --tg

      - name: Сохранить журнал
        run: |
          git config user.name "trading-assistant"
          git config user.email "noreply@github.com"
          git add state/
          if git diff --staged --quiet; then
            echo "Изменений в журнале нет — коммит не нужен."
          else
            git commit -m "Журнал бумажной торговли: $(date -u '+%Y-%m-%d %H:%M') UTC"
            # Если в репозиторий что-то попало во время прохода, push будет
            # отвергнут и журнал за этот проход пропадёт. Забираем чужое и
            # накладываем своё сверху. Пробуем трижды: два прохода в 8:17
            # идут подряд и могут столкнуться друг с другом.
            #
            # Имя переменной ОБЯЗАНО быть латиницей. Кириллическое "попытка"
            # даёт "not a valid identifier", цикл не выполняется ни разу,
            # и журнал теряется — то есть ровно та беда, от которой этот
            # цикл написан. Это пятый случай в проекте, когда кириллица
            # в служебном имени всё ломает: было с именем куки, переменной
            # окружения, ключами JSON и идентификатором задания workflow.
            for attempt in 1 2 3; do
              if git push; then
                echo "Журнал сохранён с попытки $attempt."
                exit 0
              fi
              echo "Push отвергнут, забираю изменения и пробую снова."
              git pull --rebase --autostash || exit 1
            done
            echo "Журнал сохранить не удалось за три попытки."
            exit 1
          fi
