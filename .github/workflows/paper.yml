name: Бумажная торговля

# Запуск каждые 4 часа — по закрытию бара на выбранном таймфрейме.
# Расписание в GitHub неточное: задержка 5-30 минут обычна. Для 4-часовых
# свечей это несущественно, для минутных было бы неприемлемо.
on:
  schedule:
    - cron: "17 */4 * * *"     # короткие сделки: каждые 4 часа
    - cron: "17 8 * * *"       # долгосрочный обзор: раз в сутки
  workflow_dispatch:            # кнопка ручного запуска на вкладке Actions

# Нужно право записи: журнал сделок коммитится обратно в репозиторий,
# иначе следующий запуск не увидит открытые позиции.
permissions:
  contents: write

concurrency:
  group: paper-trading
  cancel-in-progress: false     # не обрывать проход на середине

jobs:
  # Идентификатор задания обязан быть латиницей: GitHub разбирает его
  # как имя переменной, и кириллица ломает файл целиком — запуск создаётся,
  # но не выполняет ни одного шага.
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Забрать код и журнал
        uses: actions/checkout@v4

      - name: Поставить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
        # Зависимостей нет намеренно — весь движок на стандартной библиотеке,
        # поэтому шага установки пакетов здесь нет.

      - name: Проверить правила риск-менеджмента
        # Если правила сломаны, торговать нельзя даже на бумаге.
        run: |
          python tests/test_rules.py
          python tests/test_signals.py
          python tests/test_stop_after_entry.py
          python tests/test_journals_walk.py
          python tests/test_health.py
          python tests/test_portfolio_quota.py
          python tests/test_exit_rules.py
          python tests/test_pyramid.py
          python tests/test_tgbuttons.py
          python tests/test_integrity.py

      - name: Провести сделки и найти новые сигналы
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # Флаг --жив включается по воскресеньям: раз в неделю бот
        # подтверждает, что работает, даже если сигналов не было.
        run: |
          if [ "$(date -u +%u)" = "7" ] && [ "$(date -u +%H)" = "08" ]; then
            python paper.py --жив
          else
            python paper.py
          fi

      # ВСЕ СИСТЕМЫ ХОДЯТ КАЖДЫЙ ПРОХОД. Раньше дневные стояли на условии
      # github.event.schedule == '17 8 * * *'. Оно перестало совпадать,
      # шаги молча помечались skipped, и пять суток подряд прорывы
      # и долгосрочная не выполнялись вовсе — при том, что все 30 запусков
      # были зелёные. Условие по строке расписания хрупкое: GitHub задерживает
      # запуски на десятки минут и волен подставить не ту строку.
      # Теперь проводка идемпотентна (идёт только по закрытым дневным барам),
      # поэтому запускать её можно каждые четыре часа без вреда.
      - name: Долгосрочные позиции
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # paper_long.py ведёт САМИ ПОЗИЦИИ. Его в workflow не было вовсе:
        # запускался только long.py, который лишь печатает обзор. Поэтому
        # долгосрочная система не торговала на бумаге ни одного дня.
        run: python paper_long.py

      - name: Система прорывов
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python breakouts.py --tg

      - name: Долгосрочный обзор в Telegram
        # Только отчёт, не торговля. Раз в сутки — чтобы не спамить.
        # Час берём из системного времени, а не из строки расписания:
        # это то, что действительно известно, и оно не может разъехаться.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          hour=$(date -u +%H)
          if [ "$hour" -ge 8 ] && [ "$hour" -lt 12 ]; then
            python long.py --tg
          else
            echo "Обзор шлётся в утренний проход, сейчас $hour UTC."
          fi

      - name: Пересобрать кеш сигналов раз в месяц
        # Кеш — основа ВСЕХ замеров. Он собран один раз в августе, и каждая
        # проверка гипотезы идёт по нему: чем он старее, тем больше свежих
        # данных мы не видим. Пересобираем первого числа, в утренний проход.
        # Гейт по системному времени, а не по строке cron — она уже подводила.
        run: |
          if [ "$(date -u +%d)" = "01" ] && [ "$(date -u +%H)" -ge 8 ]              && [ "$(date -u +%H)" -lt 12 ]; then
            python collect.py
          else
            echo "Кеш пересобирается первого числа."
          fi

      - name: Недельный отчёт в Telegram
        # По воскресеньям в утренний проход. Между событиями бот молчит,
        # и по тишине не понять, идут дела или стоят. Час берём из системного
        # времени, а не из строки расписания: строка cron уже подводила.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "$(date -u +%u)" = "7" ] && [ "$(date -u +%H)" -ge 8 ]              && [ "$(date -u +%H)" -lt 12 ]; then
            python weekly.py --tg
          else
            echo "Недельный отчёт уходит воскресным утром."
          fi

      - name: Снимок счёта за сегодня
        # Один снимок в сутки, по последнему проходу. Без него история
        # терялась безвозвратно: мы знали только «сейчас», и проверить,
        # помогло ли изменение настроек, было не с чем.
        run: python snapshot.py

      - name: Сторож — не стоит ли система молча
        # Ставится ПОСЛЕ всех систем и ДО сохранения журнала.
        # Ловит то, что не даёт ошибки: систему, переставшую запускаться,
        # позицию, у которой не считаются дни, запись, зависшую после срока.
        # Именно такая поломка съела пять суток при тридцати зелёных запусках.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python health.py --tg

      - name: Сохранить журнал
        if: always()          # журнал сохраняем даже если сторож поднял тревогу
        run: |
          git config user.name "trading-assistant"
          git config user.email "noreply@github.com"
          git add state/ cache/
          if git diff --staged --quiet; then
            echo "Изменений в журнале нет — коммит не нужен."
          else
            git commit -m "Журнал бумажной торговли: $(date -u '+%Y-%m-%d %H:%M') UTC"
            # Если в репозиторий что-то попало во время прохода, push будет
            # отвергнут и журнал за этот проход пропадёт. Забираем чужое и
            # накладываем своё сверху. Пробуем трижды: два прохода в 8:17
            # идут подряд и могут столкнуться друг с другом.
            #
            # Имя переменной ОБЯЗАНО быть латиницей. Кириллическое "попытка"
            # даёт "not a valid identifier", цикл не выполняется ни разу,
            # и журнал теряется — то есть ровно та беда, от которой этот
            # цикл написан. Это пятый случай в проекте, когда кириллица
            # в служебном имени всё ломает: было с именем куки, переменной
            # окружения, ключами JSON и идентификатором задания workflow.
            for attempt in 1 2 3; do
              if git push; then
                echo "Журнал сохранён с попытки $attempt."
                exit 0
              fi
              echo "Push отвергнут, забираю изменения и пробую снова."
              git pull --rebase --autostash || exit 1
            done
            echo "Журнал сохранить не удалось за три попытки."
            exit 1
          fi
