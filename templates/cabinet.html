<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Кабинет — торговый ассистент</title>__СТИЛИ__</head><body>

<div class="шапка">
  <div><h1>Торговый ассистент</h1><p class="тихо" id="статус">Загрузка…</p></div>
  <a href="/logout" class="тихо">Выйти</a>
</div>

<div class="карточка">
  <label class="метка">Капитал — выберите сумму, расчёты пересчитаются для всех сразу</label>
  <div class="чипы" id="чипы"></div>
  <div class="панель" style="margin-top:14px">
    <div class="поле"><label>Своя сумма, $</label>
      <input id="капитал" type="number" min="10" step="10" value="50"></div>
    <div class="поле"><label>Риск на сделку, %</label>
      <select id="риск">
        <option value="0.5">0.5% — осторожно</option>
        <option value="1" selected>1% — стандарт</option>
        <option value="2">2% — предел разумного</option>
        <option value="3">3% — выше нормы</option>
        <option value="5">5% — опасно</option>
      </select></div>
    <div class="поле"><label>Плечо</label>
      <select id="плечо">
        <option value="1" selected>1x — спот, без ликвидации</option>
        <option value="2">2x</option><option value="3">3x</option>
        <option value="5">5x</option><option value="10">10x</option>
      </select></div>
    <div class="поле"><button onclick="загрузить(true)">Обновить данные</button></div>
  </div>
  <p class="тихо" id="подсказка"></p>
</div>

<div class="сетка" id="итоги"></div>

<div class="карточка" id="ожидание"></div>

<h2>Сигналы к действию</h2>
<div id="сделки"></div>

<h2>Бумажный журнал</h2>
<div class="карточка" id="журнал"></div>

<h2>Состояние рынка</h2>
<div class="карточка обёртка"><table>
<thead><tr><th>Монета</th><th>Цена</th><th>Режим</th><th>Волатильность</th>
<th>Можно входить?</th><th>Почему</th></tr></thead>
<tbody id="строки"></tbody></table></div>

<p class="мелко">Система ничего не исполняет — решение принимаете вы.
Прибыльность стратегии на исторических данных не подтверждена.</p>

<script>
const $ = id => document.getElementById(id);
const СУММЫ = [10, 20, 30, 50, 100, 250];
let данные = null, выбранный = 50;

const д2 = n => n == null ? '—' :
  n.toLocaleString('ru-RU', {minimumFractionDigits: 2, maximumFractionDigits: 2});

function рисоватьЧипы() {
  $('чипы').innerHTML = СУММЫ.map(с =>
    `<button class="чип ${с === выбранный ? 'активный' : ''}"
      onclick="выбрать(${с})">${с} $</button>`).join('');
}

function выбрать(с) {
  выбранный = с;
  $('капитал').value = с;
  рисоватьЧипы();
  перерисовать();
  сохранить();
}

function сохранить() {
  localStorage.setItem('настройки', JSON.stringify(
    {к: выбранный, р: $('риск').value, п: $('плечо').value}));
}

// --- расчёт позиции под конкретный капитал, целиком на стороне браузера ---
function позиция(м, капитал, риск) {
  const с = м.сделка;
  if (!с) return null;
  const стопОтн = Math.abs(с.вход - с.стоп) / с.вход;
  let размер = (капитал * риск / 100) / (с.вход * стопОтн);
  const шаг = м.шаг || 0;
  if (шаг > 0) размер = Math.floor(размер / шаг + 1e-9) * шаг;
  const объём = размер * с.вход;
  const рискДенег = размер * Math.abs(с.вход - с.стоп);
  const прибыль = размер * Math.abs(с.цель - с.вход);
  const издержки = объём * 0.0025;
  return {
    размер, объём, рискДенег, прибыль, издержки,
    доступно: объём >= (м.мин_объём || 5) && размер > 0,
    чистая: прибыль - издержки,
  };
}

function вердикт(м) {
  if (м.ошибка) return ['бок', 'нет данных'];
  if (м.сделка) return [м.сделка.направление === 'Long' ? 'вверх' : 'вниз',
                        м.сделка.направление === 'Long' ? 'ДА — покупка' : 'ДА — шорт'];
  if (м.волатильность === 'высокая') return ['хаос', 'нет — рынок штормит'];
  if (м.режим === 'тренд вверх') return ['вверх', 'только лонг, ждём момент'];
  if (м.режим === 'тренд вниз') return ['вниз', 'только шорт, ждём момент'];
  if (м.режим === 'боковик') return ['бок', 'ждём выхода из диапазона'];
  return ['бок', 'направление неясно'];
}

function классРежима(р) {
  return р === 'тренд вверх' ? 'вверх' : р === 'тренд вниз' ? 'вниз' : 'бок';
}

function перерисовать() {
  if (!данные) return;
  const риск = +$('риск').value, плечо = +$('плечо').value;
  const рискДенег = выбранный * риск / 100;

  $('подсказка').innerHTML =
    `При капитале <b>${выбранный} $</b> и риске ${риск}% вы рискуете `
    + `<b>${д2(рискДенег)} $</b> в одной сделке.`
    + (плечо > 1
       ? ` Плечо ${плечо}x: появляется принудительное закрытие позиции и плата за удержание.`
       : ' Без плеча: ликвидации не существует.');

  $('итоги').innerHTML = [
    ['Капитал', выбранный + ' $'],
    ['Риск на сделку', д2(рискДенег) + ' $'],
    ['Сигналов сейчас', данные.сигналов],
    ['Монет под наблюдением', данные.монет],
  ].map(([т, з]) => `<div class="карточка"><div class="мелко">${т}</div>
    <div class="цифра">${з}</div></div>`).join('');

  // --- статистика стратегии ---
  // Раньше этот блок читался как прогноз по конкретной сделке, хотя описывает
  // среднее по многим. Теперь сначала показываются исходы отдельной сделки
  // (они плюсовые и минусовые), и только потом среднее по сотне.
  const о = данные.ожидание;
  const выигрыш = о.средний_выигрыш_R * рискДенег;
  const проигрыш = о.средний_проигрыш_R * рискДенег;
  const наСделку = о.средний_R * рискДенег;
  const вМесяц = наСделку * о.сделок_в_месяц;
  const из100 = наСделку * 100;
  const знакКласс = вМесяц >= 0 ? 'вверх' : 'вниз';

  $('ожидание').innerHTML = `
    <h2 style="margin-top:0">Статистика стратегии</h2>
    <p class="тихо">Это <b>не прогноз по текущей сделке</b> — сейчас открытых сигналов
      ${данные.сигналов}. Это средний итог по ${о.сделок} проверенным сделкам,
      пересчитанный на капитал ${выбранный} $ при риске ${риск}%.</p>

    <div class="сетка3" style="margin-top:16px">
      <div><div class="мелко">Удачная сделка приносит</div>
        <div class="цифра вверх">+${д2(выигрыш)} $</div>
        <div class="мелко">так заканчивается ${о.побед_из_100} сделок из 100</div></div>
      <div><div class="мелко">Неудачная сделка забирает</div>
        <div class="цифра вниз">${д2(проигрыш)} $</div>
        <div class="мелко">так заканчивается ${100 - о.побед_из_100} сделок из 100</div></div>
      <div><div class="мелко">Итог после 100 сделок</div>
        <div class="цифра ${знакКласс}">${из100 >= 0 ? '+' : ''}${д2(из100)} $</div>
        <div class="мелко">примерно ${(100 / о.сделок_в_месяц).toFixed(0)} месяцев торговли</div></div>
    </div>

    <p style="margin-top:14px">Проще говоря: <b>${о.побед_из_100} выигрышей
      по ${д2(выигрыш)} $</b> не покрывают <b>${100 - о.побед_из_100} проигрышей
      по ${д2(Math.abs(проигрыш))} $</b>. Разница и есть итог.</p>

    <p class="тихо">Порог безубыточности — ${о.порог_побед.toFixed(0)}% побед,
      у нас ${о.доля_побед.toFixed(1)}%. Не хватает
      ${(о.порог_побед - о.доля_побед).toFixed(1)} пункта.
      Худшая просадка за период: ${д2(о.просадка_R * рискДенег)} $.</p>
    <p class="${о.средний_R >= 0 ? 'тихо' : 'ошибка'}">${о.вывод}</p>`;

  // --- карточки сделок с разбивкой по всем суммам ---
  const сделки = данные.монеты.filter(м => м.сделка);
  $('сделки').innerHTML = сделки.length ? сделки.map(м => {
    const с = м.сделка, длин = с.направление === 'Long';
    const п = позиция(м, выбранный, риск);
    const строки = СУММЫ.map(сумма => {
      const x = позиция(м, сумма, риск);
      if (!x.доступно) return `<tr class="${сумма === выбранный ? 'подсветка' : ''}">
        <td>${сумма} $</td><td colspan="4" class="тихо">не проходит минимум биржи</td></tr>`;
      return `<tr class="${сумма === выбранный ? 'подсветка' : ''}">
        <td><b>${сумма} $</b></td>
        <td>${x.размер.toFixed(6)}</td>
        <td>${д2(x.объём)} $</td>
        <td class="вниз">−${д2(x.рискДенег)} $</td>
        <td class="вверх">+${д2(x.чистая)} $</td></tr>`;
    }).join('');

    return `<div class="карточка сделка">
      <h1>${длин ? '🟢 Покупка' : '🔴 Продажа в шорт'} · ${м.актив.replace('USDT','')}</h1>
      <p class="тихо">Уверенность: ${с.уверенность} · режим: ${м.режим}</p>
      <ol class="шаги">
        <li>Ордер на ${длин ? 'покупку' : 'продажу'} по цене <b>${д2(с.вход)}</b> (${с.тип_ордера})</li>
        <li>Сразу стоп-лосс на <b>${д2(с.стоп)}</b> — обязательно</li>
        <li>Закрыть при <b>${д2(с.цель)}</b></li>
      </ol>
      ${с.ликвидация ? `<p class="ошибка">Ликвидация на ${д2(с.ликвидация)} —
        при плече позицию закроют принудительно, если цена дойдёт сюда.</p>` : ''}
      <div class="обёртка"><table class="узкая">
        <thead><tr><th>Капитал</th><th>Купить</th><th>Объём</th>
          <th>Потеряете</th><th>Заработаете</th></tr></thead>
        <tbody>${строки}</tbody></table></div>
      <p class="мелко">«Заработаете» — при достижении цели, за вычетом комиссий.
        Возможная прибыль в ${с.rr.toFixed(1)} раза больше риска.
        Основания: ${с.подтверждения.join(' · ')}</p>
    </div>`;
  }).join('') : `<div class="карточка"><p><b>Сигналов нет.</b></p>
    <p class="тихо">Это нормальный результат: система молчит, когда условия не сложились.
    Ждать приходится дольше, чем хочется — примерно 4–5 сигналов в неделю на 15 монет.</p></div>`;

  // --- журнал ---
  const ж = данные.журнал;
  $('журнал').innerHTML = ж.закрыто === 0
    ? `<p>Сделок в работе: <b>${ж.открыты}</b> · ждут входа: <b>${ж.ожидают}</b>
       · закрыто: <b>0</b></p>
       <p class="тихо">Бумажная торговля запущена. Статистика появится, когда
       наберётся хотя бы 30 закрытых сделок — раньше выводы будут случайными.</p>`
    : `<div class="сетка3">
        <div><div class="мелко">Закрыто сделок</div><div class="цифра">${ж.закрыто}</div></div>
        <div><div class="мелко">Доля побед</div><div class="цифра">${ж.доля_побед.toFixed(0)}%</div></div>
        <div><div class="мелко">Итог</div>
          <div class="цифра ${ж.сумма_R >= 0 ? 'вверх' : 'вниз'}">${ж.сумма_R >= 0 ? '+' : ''}${ж.сумма_R.toFixed(2)}R</div></div>
       </div>
       <p class="тихо">В работе ${ж.открыты}, ждут входа ${ж.ожидают}.
       При капитале ${выбранный} $ и риске ${риск}% это
       ${д2(ж.сумма_R * рискДенег)} $ на бумаге.</p>`;

  // --- таблица рынка ---
  $('строки').innerHTML = данные.монеты.map(м => {
    if (м.ошибка) return `<tr><td>${м.актив}</td><td colspan="5" class="тихо">нет данных</td></tr>`;
    const [кл, текст] = вердикт(м);
    return `<tr>
      <td><b>${м.актив.replace('USDT','')}</b></td>
      <td>${д2(м.цена)}</td>
      <td><span class="знак ${классРежима(м.режим)}">${м.режим}</span></td>
      <td><span class="знак ${м.волатильность === 'высокая' ? 'хаос' : 'бок'}">${м.волатильность}</span></td>
      <td><span class="знак ${кл}">${текст}</span></td>
      <td class="мелко">${м.почему || '—'}</td></tr>`;
  }).join('');
}

async function загрузить(обновить) {
  $('статус').textContent = 'Считаю…';
  const о = await fetch('/api?leverage=' + $('плечо').value + (обновить ? '&refresh=1' : ''));
  данные = await о.json();
  $('статус').textContent =
    `Обновлено в ${данные.обновлено} · монет ${данные.монет} · сигналов ${данные.сигналов}`;
  перерисовать();
}

const сохр = localStorage.getItem('настройки');
if (сохр) {
  const {к, р, п} = JSON.parse(сохр);
  выбранный = к || 50; $('риск').value = р || 1; $('плечо').value = п || 1;
}
$('капитал').value = выбранный;
$('капитал').oninput = () => { выбранный = +$('капитал').value || 10; рисоватьЧипы(); перерисовать(); сохранить(); };
$('риск').onchange = () => { перерисовать(); сохранить(); };
$('плечо').onchange = () => { сохранить(); загрузить(false); };
рисоватьЧипы();
загрузить(false);
</script></body></html>
