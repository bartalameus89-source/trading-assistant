<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Мои сделки — торговый ассистент</title>__СТИЛИ__</head><body>

<div class="шапка">
  <div><h1>Мои сделки</h1>
    <p class="тихо" id="статус">Загрузка…</p></div>
  <div><a href="/" class="тихо">← К сигналам</a> &nbsp; <a href="/logout" class="тихо">Выйти</a></div>
</div>

<div class="карточка">
  <label class="метка">Период</label>
  <div class="чипы" id="периоды"></div>
  <div class="панель" style="margin-top:14px">
    <div class="поле"><label>С даты</label><input id="от" type="date"></div>
    <div class="поле"><label>По дату</label><input id="до" type="date"></div>
    <div class="поле"><button onclick="своё()">Показать за период</button></div>
  </div>
</div>

<div class="сетка" id="итоги"></div>

<div class="карточка" id="сравнение"></div>

<h2>Список решений</h2>
<div class="карточка обёртка"><table>
  <thead><tr>
    <th>Когда</th><th>Монета</th><th>Решение</th><th>Направление</th>
    <th>Вход</th><th>Стоп</th><th>Цель</th><th>Состояние</th><th>Итог</th><th>Действия</th>
  </tr></thead>
  <tbody id="строки"></tbody>
</table></div>

<p class="мелко">Пропущенные сделки тоже доводятся до результата — иначе
невозможно понять, удачно ли вы их пропустили.</p>

<script>
const $ = id => document.getElementById(id);
const д2 = n => n == null ? '—' :
  n.toLocaleString('ru-RU', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const дата = t => new Date(t * 1000).toLocaleDateString('ru-RU',
  {day: '2-digit', month: '2-digit', year: '2-digit'});

const ПЕРИОДЫ = [
  ['Сегодня', () => [начало_дня(0), Date.now() / 1000]],
  ['7 дней', () => [Date.now() / 1000 - 7 * 86400, Date.now() / 1000]],
  ['30 дней', () => [Date.now() / 1000 - 30 * 86400, Date.now() / 1000]],
  ['3 месяца', () => [Date.now() / 1000 - 91 * 86400, Date.now() / 1000]],
  ['Год', () => [Date.now() / 1000 - 365 * 86400, Date.now() / 1000]],
  ['Всё время', () => [0, 99999999999]],
];
let выбран = 2;   // по умолчанию 30 дней

function начало_дня(сдвиг) {
  const д = new Date();
  д.setHours(0, 0, 0, 0);
  return д.getTime() / 1000 - сдвиг * 86400;
}

function рисоватьПериоды() {
  $('периоды').innerHTML = ПЕРИОДЫ.map((п, i) =>
    `<button class="чип ${i === выбран ? 'активный' : ''}"
      onclick="выбратьПериод(${i})">${п[0]}</button>`).join('');
}

function выбратьПериод(i) {
  выбран = i;
  рисоватьПериоды();
  const [от, до] = ПЕРИОДЫ[i][1]();
  загрузить(от, до, ПЕРИОДЫ[i][0]);
}

function своё() {
  const от = $('от').value ? new Date($('от').value).getTime() / 1000 : 0;
  const до = $('до').value
    ? new Date($('до').value).getTime() / 1000 + 86400 : Date.now() / 1000;
  выбран = -1;
  рисоватьПериоды();
  загрузить(от, до, `${$('от').value || '…'} — ${$('до').value || 'сейчас'}`);
}

function блокИтогов(с, подпись) {
  const знак = с.сумма_денег >= 0 ? 'вверх' : 'вниз';
  return `<div class="карточка">
    <div class="мелко">${подпись}</div>
    <div class="цифра ${знак}">${с.сумма_денег >= 0 ? '+' : ''}${д2(с.сумма_денег)} $</div>
    <div class="мелко">${с.завершено} завершено, ${с.доля_побед.toFixed(0)}% побед</div>
  </div>`;
}

function кнопкиДействий(р) {
  // Что можно сделать с записью, зависит от её состояния. При ручной торговле
  // система не знает, выставили вы ордер и по какой цене он исполнился, —
  // эти кнопки позволяют привести журнал в соответствие с реальностью.
  if (р.состояние === 'ждёт входа') {
    return `<button class="мини" onclick="действие('${р.ид}','entered')">Вошёл</button>
            <button class="мини серая" onclick="действие('${р.ид}','cancel')">Не входил</button>
            <button class="мини серая" onclick="действие('${р.ид}','delete')">✕</button>`;
  }
  if (р.состояние === 'в работе') {
    return `<button class="мини" onclick="действие('${р.ид}','close')">Закрыл</button>`;
  }
  return `<button class="мини серая" onclick="действие('${р.ид}','delete')">✕</button>`;
}

async function действие(ид, что) {
  let цена = null;
  if (что === 'entered') {
    const в = prompt('По какой цене вы вошли? Оставьте пустым, если по плановой:');
    if (в === null) return;
    цена = parseFloat(в.replace(',', '.')) || null;
  }
  if (что === 'close') {
    const в = prompt('По какой цене вы закрыли сделку?');
    if (в === null) return;
    цена = parseFloat(в.replace(',', '.'));
    if (!цена) { alert('Нужна цена закрытия'); return; }
  }
  if (что === 'delete' && !confirm('Удалить запись из журнала?')) return;

  const о = await fetch('/api/decision/action', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({id: ид, action: что, price: цена})});
  const р = await о.json();
  if (!р.ok) { alert('Не получилось: ' + р.текст); return; }
  выбратьПериод(выбран >= 0 ? выбран : 5);
}

async function загрузить(от, до, подпись) {
  $('статус').textContent = 'Загрузка…';
  const о = await fetch(`/api/decisions?from=${Math.floor(от)}&to=${Math.floor(до)}`);
  const д = await о.json();
  const с = д.статистика;
  const реш = д.решения;

  $('статус').textContent =
    `${подпись} · решений ${реш.length} из ${д.всего_за_всё_время} за всё время`
    + (реш.some(р => р.ид.startsWith('DEMO-'))
       ? ' · учебные записи в статистику не входят' : '');

  $('итоги').innerHTML = [
    ['Взятые сделки', с.взятые],
    ['Пропущенные', с.пропущенные],
  ].map(([п, ст]) => блокИтогов(ст, п)).join('')
    + `<div class="карточка"><div class="мелко">В работе сейчас</div>
        <div class="цифра">${с.все.в_работе + с.все.ждут}</div>
        <div class="мелко">${с.все.ждут} ждут входа</div></div>`
    + `<div class="карточка"><div class="мелко">Всего решений</div>
        <div class="цифра">${реш.length}</div>
        <div class="мелко">завершено ${с.все.завершено}</div></div>`;

  // --- сравнение: помогли ли ваши решения ---
  const в = с.взятые, п = с.пропущенные;
  let текст;
  if (в.завершено + п.завершено < 10) {
    текст = `<p class="тихо">Чтобы понять, помогают ли ваши решения, нужно хотя бы
      10 завершённых сделок. Сейчас ${в.завершено + п.завершено}.</p>`;
  } else if (п.завершено === 0) {
    текст = `<p>Вы брали все предложенные сделки. Сравнивать не с чем —
      пропустите несколько, и здесь появится ответ, помогает ли это.</p>`;
  } else {
    const лучше = в.сумма_R / Math.max(в.завершено, 1)
                > п.сумма_R / Math.max(п.завершено, 1);
    текст = `<p><b>${лучше ? 'Ваш отбор помогает.' : 'Ваш отбор мешает.'}</b>
      Взятые сделки дали ${д2(в.сумма_R / Math.max(в.завершено, 1))}R в среднем,
      пропущенные — ${д2(п.сумма_R / Math.max(п.завершено, 1))}R.</p>
      <p class="тихо">${лучше
        ? 'То есть вы отсеивали именно те сделки, которые оказывались хуже.'
        : 'То есть вы отсеивали сделки, которые оказались бы прибыльнее взятых. ' +
          'Это частая история: пропускают обычно те входы, что выглядят страшнее, ' +
          'а страшнее часто выглядят лучшие.'}</p>`;
  }
  $('сравнение').innerHTML = `<h2 style="margin-top:0">Помогают ли ваши решения</h2>${текст}`;

  // --- таблица ---
  $('строки').innerHTML = реш.length ? реш.slice().reverse().map(р => {
    const итог = р.результат_денег == null ? '—'
      : `<span class="${р.результат_денег >= 0 ? 'вверх' : 'вниз'}">
         ${р.результат_денег >= 0 ? '+' : ''}${д2(р.результат_денег)} $</span>`;
    const сост = р.состояние === 'завершена'
      ? `<span class="знак ${р.исход === 'цель' ? 'вверх' : р.исход === 'стоп' ? 'вниз' : 'бок'}">${р.исход}</span>`
      : `<span class="знак хаос">${р.состояние}</span>`;
    return `<tr>
      <td>${дата(р.когда)}</td>
      <td><b>${р.актив.replace('USDT', '')}</b>${
        р.ид.startsWith('DEMO-') ? ' <span class="знак хаос">учебная</span>' : ''}</td>
      <td><span class="знак ${р.решение === 'взял' ? 'вверх' : 'бок'}">${р.решение}</span></td>
      <td>${р.направление === 'Long' ? 'покупка' : 'шорт'}</td>
      <td>${д2(р.вход)}</td><td>${д2(р.стоп)}</td><td>${д2(р.цель)}</td>
      <td>${сост}</td><td>${итог}</td>
      <td class="действия">${кнопкиДействий(р)}</td></tr>`;
  }).join('') : `<tr><td colspan="10" class="тихо">За этот период решений нет.
    Нажмите «Взял» или «Пропустил» на карточке сигнала — записи появятся здесь.</td></tr>`;
}

рисоватьПериоды();
выбратьПериод(выбран);
</script></body></html>
